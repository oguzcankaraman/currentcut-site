<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f5f6f8;color:#0f1524;font-family:"IBM Plex Sans",system-ui,sans-serif;display:grid;grid-template-columns:600px 1fr;align-items:center;gap:40px;padding:0 64px;overflow:hidden}
.logo{display:flex;align-items:center;gap:14px;font:800 34px "Schibsted Grotesk",sans-serif;letter-spacing:-.02em}
.logo i{width:56px;height:56px;border-radius:14px;background:#0f1524;position:relative;display:block}
.logo i:before{content:"";position:absolute;left:12px;top:17px;width:30px;height:23px;border:4px solid #fff;border-radius:5px}
.logo i:after{content:"";position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:#1f3fae;border:3px solid #f5f6f8}
h1{font:800 72px/1.02 "Schibsted Grotesk",sans-serif;letter-spacing:-.035em;margin:44px 0 24px}
h1 em{font-style:normal;color:#1f3fae}
p{font-size:26px;line-height:1.35;color:#586074;max-width:580px}
.shot{border-radius:16px;overflow:hidden;border:1px solid #dde1e8;box-shadow:0 30px 60px -30px rgba(15,21,36,.5);background:#fff}
.shot .bar{height:34px;background:#eef0f4;display:flex;gap:8px;align-items:center;padding-left:14px}
.shot .bar b{width:11px;height:11px;border-radius:50%;background:#cfd4dd}
.shot img{display:block;width:100%;height:auto}
</style>
<body>
<div><div class="logo"><i></i>Currentcut</div>
<h1>Help-center videos that <em>keep up with your UI.</em></h1>
<p>Short SaaS tutorials, re-recorded and re-voiced automatically when your UI changes.</p></div>
<div class="shot"><div class="bar"><b></b><b></b><b></b></div><img src="hero-poster.jpg"></div>
